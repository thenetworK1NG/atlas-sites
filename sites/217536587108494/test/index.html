<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h1 {
            color: #1a73e8;
            margin: 0 0 10px;
        }
        .card p {
            color: #555;
            margin: 0;
        }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 14px;
            background: #e6f4ea;
            color: #1e8e3e;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, it works</h1>
        <p>This is a test page from ATLAS.</p>
        <span class="status">site is live</span>
    </div>
</body>
</html>
