<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0f;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .wrap { text-align: center; }
  h1 {
    color: #00ffcc;
    font-size: clamp(40px, 8vw, 90px);
    margin: 0;
    text-shadow: 0 0 10px #00ffcc, 0 0 30px rgba(0,255,204,.7);
    animation: blink 2.4s ease-in-out infinite;
  }
  p {
    color: #8b8ba8;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 14px;
    margin-top: 20px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .6; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Hello, World</h1>
    <p>first site from a voice note</p>
  </div>
</body>
</html>
