<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT - Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0f;
    --paper: #f2efe9;
    --mute: rgba(242,239,233,.55);
    --line: rgba(242,239,233,.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--ink);
    color: var(--paper);
    overflow-x: hidden;
  }

  ::selection { background: var(--paper); color: var(--ink); }

  /* ---------- Nav ---------- */
  nav {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 6vw;
    mix-blend-mode: difference;
  }

  .nav-logo {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    letter-spacing: .4em;
    color: var(--paper);
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--paper);
    text-decoration: none;
    font-size: .72rem;
    letter-spacing: .26em;
    text-transform: uppercase;
    font-weight: 600;
    transition: opacity .2s ease;
  }

  .nav-links a:hover { opacity: .55; }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 6vw 8vh;
    position: relative;
  }

  .hero h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: clamp(4.5rem, 18vw, 16rem);
    line-height: .82;
    letter-spacing: .01em;
    text-transform: uppercase;
  }

  .hero h1 .outline {
    color: transparent;
    -webkit-text-stroke: 2px var(--paper);
  }

  .hero .meta {
    margin-top: 40px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .hero .meta span {
    font-size: .72rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* ---------- Work list ---------- */
  .works { padding: 0 6vw 140px; }

  .work-item {
    display: grid;
    grid-template-columns: 1fr 1.6fr 120px;
    gap: 4vw;
    align-items: center;
    padding: 54px 0;
    border-top: 1px solid var(--line);
  }

  .work-item:last-child { border-bottom: 1px solid var(--line); }

  .work-item .index {
    font-family: 'Archivo', sans-serif;
    font-size: .9rem;
    letter-spacing: .3em;
    color: var(--mute);
  }

  .work-item .frame {
    position: relative;
    overflow: hidden;
    background: #101016;
  }

  .work-item .frame img {
    width: 100%;
    height: min(70vh, 620px);
    object-fit: cover;
    display: block;
    filter: grayscale(.15);
    transition: transform 1.1s cubic-bezier(.16,1,.3,1);
  }

  .work-item:hover .frame img { transform: scale(1.035); }

  .work-item .title {
    font-family: 'Archivo', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2.1rem);
    text-transform: uppercase;
    letter-spacing: .05em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    justify-self: end;
    white-space: nowrap;
  }

  /* ---------- Statement ---------- */
  .statement {
    padding: 120px 6vw;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 4vw;
  }

  .statement .label {
    font-size: .72rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--mute);
  }

  .statement p {
    font-size: clamp(1.15rem, 2.6vw, 1.7rem);
    line-height: 1.6;
    font-weight: 300;
    max-width: 46ch;
  }

  .statement p b { font-weight: 500; }

  /* ---------- Footer ---------- */
  footer {
    padding: 80px 6vw 46px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
    align-items: center;
  }

  footer .nav-logo { position: static; mix-blend-mode: normal; font-size: 1.1rem; }

  footer span {
    font-size: .68rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .nav-links { display: none; }
    .work-item { grid-template-columns: 1fr; gap: 18px; padding: 40px 0; }
    .work-item .frame img { height: 52vh; }
    .work-item .title { writing-mode: horizontal-tb; transform: none; justify-self: start; }
    .statement { grid-template-columns: 1fr; gap: 20px; }
    .works { padding-bottom: 90px; }
  }

  /* ---------- Reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .9s ease, transform .9s ease;
  }

  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">RT</div>
  <ul class="nav-links">
    <li><a href="#works">Works</a></li>
    <li><a href="#statement">Statement</a></li>
  </ul>
</nav>

<header class="hero">
  <h1>RT<span class="outline">B81</span></h1>
  <div class="meta">
    <span>Art</span>
    <span>Works</span>
    <span>Selected</span>
  </div>
</header>

<main id="works" class="works">

  <div class="work-item reveal">
    <span class="index">01</span>
    <div class="frame">
      <img src="rt-logo.jpg" alt="Untitled 01">
    </div>
    <h2 class="title">Untitled 01</h2>
  </div>

  <div class="work-item reveal">
    <span class="index">02</span>
    <div class="frame">
      <img src="bow8tip.jpg" alt="Untitled 02">
    </div>
    <h2 class="title">Untitled 02</h2>
  </div>

</main>

<section id="statement" class="statement">
  <span class="label">Statement</span>
  <p>Two works. <b>RT</b> and <b>Bow8Tip</b>. Nothing added, nothing explained. The work speaks, you just look.</p>
</section>

<footer>
  <div class="nav-logo">RT</div>
  <span>&#169; RT x Bow8Tip</span>
</footer>

<script>
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: .15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>

</body>
</html>
