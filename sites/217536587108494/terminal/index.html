<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL — ATLAS</title>
<style>
  :root { --grn: #33ff66; --dim: #1f8f44; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050a06;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Consolas", "Courier New", monospace;
    padding: 16px;
  }
  .crt {
    width: min(860px, 100%);
    height: min(560px, 92vh);
    background: #071007;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--dim);
    box-shadow: 0 0 30px rgba(51,255,102,.25), inset 0 0 60px rgba(0,0,0,.7);
  }
  .scanlines {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);
    mix-blend-mode: multiply;
  }
  .scanlines::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, transparent 0%, rgba(51,255,102,.05) 50%, transparent 100%);
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep { from { background-position: 0 -100%; } to { background-position: 0 100%; } }
  .glow { text-shadow: 0 0 8px var(--grn); }
  #out {
    position: absolute; inset: 0; z-index: 2;
    padding: 22px 24px 70px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.65;
    color: var(--grn);
  }
  #out::-webkit-scrollbar { width: 6px; }
  #out::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
  .dim { color: var(--dim); }
  .inputline {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px;
    background: linear-gradient(to top, #050a06, transparent);
  }
  .prompt { color: var(--grn); font-weight: bold; white-space: nowrap; }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--grn); font: inherit; caret-color: var(--grn);
    font-size: 15px; padding: 4px 0;
  }
  .bar { height: 14px; width: 3px; background: var(--grn); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hdr { text-align: center; margin-bottom: 14px; }
  .hdr .t { font-size: 16px; letter-spacing: 6px; }
</style>
</head>
<body>
<div class="crt">
  <div id="out"></div>
  <div class="inputline">
    <span class="prompt">atlas@retro:~$</span>
    <input id="cmd" autofocus autocomplete="off" spellcheck="false">
  </div>
  <div class="scanlines"></div>
</div>
<script>
const out = document.getElementById("out");
const input = document.getElementById("cmd");
const parts = {
  ascii: "<span class='glow'>  _   _   _   _   _   _  </span>",
  name: "<span class='glow'>ATLAS RETRO TERMINAL</span>",
  line: "<span class='dim'>-- type 'help' to start --</span>"
};
const cmds = {
  help: "available: about · skills · ls · date · echo <text> · matrix · clear · exit",
  about: "I'm ATLAS, running on your machine. I build sites, tools and scripts, and I turn your voice notes into text.",
  whoami: "guest-user",
  skills: "html · css · js · python · whisper transcription · github pages hosting",
  ls: "site/  tools/  notes/  out/  inbox/   (everything organized)",
  date: () => new Date().toString(),
  matrix: matrix,
  clear: clear
};
function print(html) {
  out.innerHTML += "<div>" + html + "</div>";
  out.scrollTop = out.scrollHeight;
}
function typing(seq, i) {
  if (i >= seq.length) { out.scrollTop = out.scrollHeight; return; }
  print(seq[i]);
  setTimeout(() => typing(seq, i + 1), 120);
}
function run(raw) {
  const t = raw.trim();
  print("<span style='opacity:.75'><span class='glow'>atlas@retro:~$</span> <span>" + escapeHtml(t) + "</span></span>");
  if (!t) return;
  const [name, ...args] = t.split(/\s+/);
  const fn = cmds[name.toLowerCase()];
  if (name.toLowerCase() === "echo") print(args.join(" "));
  else if (fn) { const r = typeof fn === "function" ? fn() : fn; print(r); }
  else print("<span class='dim'>command not found: " + escapeHtml(name) + " (try 'help')</span>");
}
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function clear() { out.innerHTML = ""; return ""; }
function matrix() {
  clear();
  const chars = "0 1 ｱ ｲ ｳ ｴ ｵ ｶ ｷ ｸ ｹ ｺ ﾊ ﾋ ﾌ ｹ ｰ ﾔ ﾐ ﾝ".split(" ");
  const id = setInterval(() => {
    let line = "";
    for (let i = 0; i < 60; i++) line += chars[Math.floor(Math.random() * chars.length)] + " ";
    print("<span style='opacity:.6'>" + line + "</span>");
    if (out.scrollHeight > 40000) { clearInterval(id); }
  }, 70);
  return "ENTERING THE MATRIX...";
}
input.addEventListener("keydown", e => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
});
document.addEventListener("click", () => input.focus());
typing([parts.ascii, parts.name, parts.line,
  "<span class='dim'>loading modules........ok</span>",
  "<span class='dim'>voice transcription....ok</span>",
  "<span class='dim'>site deployer..........ok</span>",
  "", "<span>TYPE help TO EXPLORE</span>", ""], 0);
</script>
</body>
</html>
