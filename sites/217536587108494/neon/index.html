<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON — Nights</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cyan: #00f0ff;
    --pink: #ff2d95;
    --purple: #b026ff;
    --bg: #0a0214;
  }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,45,149,.14), transparent 45%),
      radial-gradient(ellipse at 80% 75%, rgba(0,240,255,.14), transparent 45%),
      radial-gradient(ellipse at 70% 20%, rgba(176,38,255,.12), transparent 50%),
      linear-gradient(180deg, #0a0214, #12001f);
  }
  .sun {
    position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
    width: 480px; height: 480px; border-radius: 50%;
    background: linear-gradient(180deg, #ffd319, #ff2d95);
    opacity: .85;
    z-index: 0;
    filter: blur(2px);
  }
  .sun::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-linear-gradient(90deg, transparent 0 24px, rgba(0,0,0,.35) 24px 28px);
    -webkit-mask: radial-gradient(circle at 50% 60%, #000 0 62%, transparent 70%);
    mask: radial-gradient(circle at 50% 60%, #000 0 62%, transparent 70%);
  }
  .wrap { position: relative; z-index: 1; text-align: center; padding: 24px; }
  .sign {
    font-family: "Arial Black", "Segoe UI", Arial, sans-serif;
    font-size: clamp(46px, 12vw, 110px);
    letter-spacing: 10px;
    color: var(--cyan);
    text-shadow:
      0 0 8px var(--cyan), 0 0 22px var(--cyan),
      0 0 55px var(--cyan), 0 0 96px rgba(0,240,255,.6);
    animation: flicker 4s linear infinite;
  }
  .sign2 {
    color: var(--pink);
    text-shadow:
      0 0 8px var(--pink), 0 0 22px var(--pink),
      0 0 55px var(--pink), 0 0 96px rgba(255,45,149,.6);
    animation-delay: 1.2s;
  }
  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    92% { opacity: .55; }
    93% { opacity: 1; }
    94% { opacity: .65; }
    95% { opacity: 1; }
  }
  .sub {
    margin-top: 22px;
    color: #cfbfff;
    letter-spacing: 4px;
    font-size: 13px;
    text-transform: uppercase;
    opacity: .85;
    animation: rise 1.2s ease both;
  }
  .grid {
    display: flex; gap: 16px; justify-content: center; margin-top: 42px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 13px 30px;
    border-radius: 40px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all .3s ease;
    animation: rise 1.2s ease both;
  }
  .btn.cyan {
    color: var(--cyan);
    border: 1.5px solid var(--cyan);
    background: rgba(0,240,255,.06);
    box-shadow: inset 0 0 12px rgba(0,240,255,.25), 0 0 18px rgba(0,240,255,.4);
  }
  .btn.pink {
    color: var(--pink);
    border: 1.5px solid var(--pink);
    background: rgba(255,45,149,.06);
    box-shadow: inset 0 0 12px rgba(255,45,149,.25), 0 0 18px rgba(255,45,149,.4);
  }
  .btn:nth-child(2) { animation-delay: .15s; }
  .btn:hover { transform: translateY(-3px) scale(1.03); filter: brightness(1.3); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .clock {
    margin-top: 46px;
    font-size: 15px;
    letter-spacing: 6px;
    color: var(--purple);
    text-shadow: 0 0 12px rgba(176,38,255,.8);
    font-family: "Consolas", monospace;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="sun"></div>
  <div class="wrap">
    <div class="sign">NEON</div>
    <div class="sign sign2">NIGHTS</div>
    <p class="sub">open 'til the sun comes up</p>
    <div class="grid">
      <a class="btn cyan">the club</a>
      <a class="btn pink">the playlist</a>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
<script>
  const c = document.getElementById("clock");
  setInterval(() => {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    c.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }, 1000);
  document.querySelectorAll(".btn").forEach(b => {
    b.addEventListener("click", () => {
      if (b.textContent.trim() === "the playlist") c.textContent = "WE NEVER CLOSE";
      else c.textContent = "welcome home";
    });
  });
</script>
</body>
</html>
