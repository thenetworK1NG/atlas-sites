<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Hello World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0014;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  .glow {
    text-align: center;
    animation: pulse 3s ease-in-out infinite;
  }

  h1 {
    font-size: clamp(3rem, 12vw, 8rem);
    font-weight: 800;
    letter-spacing: 6px;
    color: #00fff7;
    text-shadow:
      0 0 8px #00fff7,
      0 0 20px #00fff7,
      0 0 45px #ff00e6,
      0 0 90px #ff00e6;
  }

  span {
    color: #ff00e6;
    text-shadow:
      0 0 8px #ff00e6,
      0 0 20px #ff00e6,
      0 0 45px #00fff7,
      0 0 90px #00fff7;
  }

  .tag {
    margin-top: 1.5rem;
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d9d9ff;
    text-shadow: 0 0 12px rgba(217, 217, 255, 0.8);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
</style>
</head>
<body>
  <div class="glow">
    <h1>Hello<span>.</span></h1>
    <div class="tag">world in neon</div>
  </div>
</body>
</html>
