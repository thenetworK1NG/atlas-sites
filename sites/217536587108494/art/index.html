<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTAGE — Art Showcase</title>
<style>
  :root {
    --bg: #0b0b10;
    --fg: #eae6f5;
    --accent: #c084fc;
    --accent2: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
  }
  canvas#bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: .5;
  }
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 90px 20px 40px;
    animation: rise 1s ease both;
  }
  header h1 {
    font-size: clamp(40px, 9vw, 84px);
    letter-spacing: 12px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
  }
  header p {
    margin-top: 14px;
    color: #9b93ae;
    letter-spacing: 2px;
    font-size: 14px;
    text-transform: uppercase;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1180px;
    margin: 30px auto 70px;
    padding: 0 24px;
  }
  .piece {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
    transition: transform .35s ease, box-shadow .35s ease;
    animation: rise .8s ease both;
  }
  .piece:nth-child(1) { animation-delay: .05s; }
  .piece:nth-child(2) { animation-delay: .12s; }
  .piece:nth-child(3) { animation-delay: .19s; }
  .piece:nth-child(4) { animation-delay: .26s; }
  .piece:nth-child(5) { animation-delay: .33s; }
  .piece:nth-child(6) { animation-delay: .40s; }
  .piece:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 18px 45px rgba(192,132,252,.28);
  }
  .art {
    position: absolute;
    inset: 0;
  }
  .piece .meta {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 18px;
    background: linear-gradient(to top, rgba(0,0,0,.65), transparent 60%);
    opacity: 0;
    transition: opacity .3s;
  }
  .piece:hover .meta { opacity: 1; }
  .piece .meta h3 { font-size: 18px; letter-spacing: 1px; }
  .piece .meta span { font-size: 12px; color: #b9b0cf; letter-spacing: 2px; text-transform: uppercase; }
  .p1 { background: linear-gradient(135deg, #1e0533, #a855f7 55%, #f0abfc); }
  .p1::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.5), transparent 35%); }
  .p2 { background: conic-gradient(from 180deg, #0f172a, #38bdf8, #0f172a, #818cf8, #0f172a); }
  .p2::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 75% 70%, rgba(255,255,255,.35), transparent 40%); }
  .p3 { background: repeating-linear-gradient(45deg, #111827 0 18px, #dc2626 18px 36px, #f59e0b 36px 54px, #111827 54px 72px); }
  .p3::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.25), transparent 50%); }
  .p4 { background: radial-gradient(circle at 20% 30%, #ec4899 0 20%, transparent 20%), radial-gradient(circle at 80% 70%, #22d3ee 0 25%, transparent 25%), radial-gradient(circle at 60% 20%, #fbbf24 0 15%, transparent 15%), #1e1b4b; }
  .p5 { background: linear-gradient(160deg, #064e3b, #10b981 60%, #a7f3d0); }
  .p5::after { content:""; position:absolute; inset:0; background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.22) 0 2px, transparent 2px 18px); }
  .p6 { background: linear-gradient(120deg, #2e1065, #6d28d9, #db2777); }
  .p6::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 85% 15%, rgba(34,211,238,.7), transparent 30%), radial-gradient(circle at 15% 85%, rgba(251,191,36,.6), transparent 30%); }
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    color: #5b5470;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 11px;
  }
  .piece canvas.anim { width: 100%; height: 100%; display: block; }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(5,5,10,.9);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 30px;
  }
  .lightbox.show { display: flex; animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .lightbox .box {
    max-width: 520px;
    width: 100%;
    aspect-ratio: 4/5;
    border-radius: 16px;
    position: relative;
    border: 1px solid rgba(255,255,255,.15);
  }
  .lightbox .box canvas { width: 100%; height: 100%; display: block; border-radius: 16px; }
  .lightbox .cap { color: var(--fg); margin-top: 16px; text-align: center; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
  .close { position: fixed; top: 24px; right: 30px; color: #fff; font-size: 30px; cursor: pointer; z-index: 21; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <h1>Vantage</h1>
  <p>a minimal art showcase</p>
</header>
<div class="grid" id="grid"></div>
<footer>atlas · six pieces, zero images</footer>
<div class="lightbox" id="lb">
  <span class="close" onclick="document.getElementById('lb').classList.remove('show')">×</span>
  <div style="text-align:center">
    <div class="box" id="lbBox"></div>
    <div class="cap" id="lbCap"></div>
  </div>
</div>
<script>
const pieces = [
  { title: "Violet Bloom", tag: "gradient · 01", cls: "p1", anim: nebula },
  { title: "Deep Current", tag: "conic · 02", cls: "p2", anim: waves },
  { title: "Signal Row", tag: "stripe · 03", cls: "p3", anim: scan },
  { title: "Orbit", tag: "orb · 04", cls: "p4", anim: orbits },
  { title: "Emerald Static", tag: "radial · 05", cls: "p5", anim: staticArcs },
  { title: "Binary Sun", tag: "duo · 06", cls: "p6", anim: suns }
];
const grid = document.getElementById("grid");
pieces.forEach((p, i) => {
  const el = document.createElement("div");
  el.className = "piece";
  el.innerHTML = '<div class="art ' + p.cls + '"></div>' +
    '<canvas class="anim"></canvas>' +
    '<div class="meta"><h3>' + p.title + '</h3><span>' + p.tag + '</span></div>';
  grid.appendChild(el);
  p.anim(el.querySelector("canvas"));
  el.addEventListener("click", () => show(i));
});
function show(i) {
  const box = document.getElementById("lbBox");
  box.innerHTML = "";
  const c = document.createElement("canvas");
  box.appendChild(c);
  pieces[i].anim(c);
  document.getElementById("lbCap").textContent = pieces[i].title + " · " + pieces[i].tag;
  document.getElementById("lb").classList.add("show");
}
/* animated background */
const bg = document.getElementById("bg").getContext("2d");
function resize() { bg.canvas.width = innerWidth; bg.canvas.height = innerHeight; }
addEventListener("resize", resize); resize();
const bgs = Array.from({ length: 42 }, () => ({
  x: Math.random() * innerWidth, y: Math.random() * innerHeight,
  r: Math.random() * 2 + .5, s: Math.random() * .35 + .08, c: Math.random()
}));
(function loop() {
  resize();
  bg.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of bgs) {
    s.y -= s.s;
    if (s.y < -5) { s.y = innerHeight + 5; s.x = Math.random() * innerWidth; }
    bg.beginPath();
    bg.arc(s.x, s.y, s.r, 0, 7);
    bg.fillStyle = s.c > .5 ? "rgba(192,132,252,.5)" : "rgba(34,211,238,.5)";
    bg.fill();
  }
  requestAnimationFrame(loop);
})();
/* small generator helpers */
function ctx(c) {
  const x = c.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = 400, H = 500;
  c.width = W * dpr; c.height = H * dpr;
  x.scale(dpr, dpr);
  return x;
}
function nebula(c) {
  const x = ctx(c); const W = 400, H = 500;
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#1e0533"); g.addColorStop(.6, "#a855f7"); g.addColorStop(1, "#f0abfc");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    x.beginPath();
    x.arc(Math.random() * W, Math.random() * H, Math.random() * 60 + 10, 0, 7);
    x.fillStyle = "rgba(255,255,255," + (Math.random() * .08) + ")";
    x.fill();
  }
  const r = x.createRadialGradient(W/2, H/2, 10, W/2, H/2, 220);
  r.addColorStop(0, "rgba(255,255,255,.5)"); r.addColorStop(1, "transparent");
  x.fillStyle = r; x.fillRect(0, 0, W, H);
}
function suns(c) {
  const x = ctx(c); const W = 400, H = 500;
  x.fillStyle = "#2e1065"; x.fillRect(0, 0, W, H);
  [[.8, .2, 70, "#22d3ee"], [.2, .8, 45, "#fbbf24"]].forEach(([cx, cy, r, col]) => {
    const g = x.createRadialGradient(W*cx, H*cy, 5, W*cx, H*cy, r*3);
    g.addColorStop(0, col); g.addColorStop(.35, col + "66"); g.addColorStop(1, "transparent");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
}
function waves(c) {
  const x = ctx(c); const W = 400, H = 500;
  [["#0f172a",0],["#38bdf8",.33],["#818cf8",.66]].forEach(([col,off]) => {
    x.beginPath();
    for (let i = 0; i <= 12; i++) {
      const px = i * W/12, py = H*(off + .06*Math.sin(i*2.4));
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.lineTo(W, H); x.lineTo(0, H); x.closePath();
    x.fillStyle = col; x.fill();
  });
}
function scan(c) {
  const x = ctx(c); const W = 400, H = 500;
  x.fillStyle = "#111827"; x.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 36) {
    x.fillStyle = (y/36) % 2 ? "#dc2626" : "#f59e0b";
    x.fillRect(0, y + 18, W, 18);
  }
  x.globalAlpha = .35;
  x.fillStyle = "#fff";
  x.fillRect(W/2 - 60, H/2 - 60, 120, 120);
  x.strokeStyle = "#fbbf24"; x.lineWidth = 4;
  x.beginPath(); x.arc(W/2, H/2, 90, 0, 7); x.stroke();
}
function orbits(c) {
  const x = ctx(c); const W = 400, H = 500;
  x.fillStyle = "#1e1b4b"; x.fillRect(0, 0, W, H);
  [[.45, .18, W, "#fbbf24"], [.15, .7, W, "#ec4899"], [.85, .8, W, "#22d3ee"]].forEach(([dx, dy, r, col]) => {
    const g = x.createRadialGradient(W*dx, H*dy, 2, W*dx, H*dy, r / 2);
    g.addColorStop(0, col); g.addColorStop(1, "transparent");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
}
function staticArcs(c) {
  const x = ctx(c); const W = 400, H = 500;
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#064e3b"); g.addColorStop(1, "#a7f3d0");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = "overlay";
  for (let i = 0; i < 26; i++) {
    x.beginPath();
    x.arc(Math.random()*W, Math.random()*H, Math.random()*120+10, 0, 7);
    x.strokeStyle = "rgba(255,255,255,.5)";
    x.lineWidth = Math.random() * 3 + 1;
    x.stroke();
  }
  x.globalCompositeOperation = "source-over";
}
</script>
</body>
</html>
